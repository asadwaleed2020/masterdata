<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d" font-family="DM Sans, Arial, sans-serif">
  <title id="t">How to read a Dubai parking zone code</title>
  <desc id="d">Illustration of a parking sign showing the code 365AP. 365 is the area number, A is the tariff zone and P means a premium space. The sign also shows paid hours and how to pay.</desc>
  <rect width="720" height="420" rx="18" fill="#f3f6fb"/>
  <!-- pole -->
  <rect x="196" y="300" width="18" height="110" rx="4" fill="#9aa8b8"/>
  <!-- sign -->
  <rect x="70" y="40" width="270" height="270" rx="16" fill="#ffffff" stroke="#154caa" stroke-width="6"/>
  <rect x="70" y="40" width="270" height="62" rx="14" fill="#154caa"/>
  <rect x="70" y="80" width="270" height="22" fill="#154caa"/>
  <text x="205" y="82" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">PAID PARKING</text>
  <text x="205" y="178" text-anchor="middle" font-size="64" font-weight="800" fill="#172c45" letter-spacing="2">365<tspan fill="#e8533f">A</tspan><tspan fill="#2869b0">P</tspan></text>
  <text x="205" y="222" text-anchor="middle" font-size="18" fill="#506478">Mon–Sat · 8:00 am – 10:00 pm</text>
  <text x="205" y="252" text-anchor="middle" font-size="18" fill="#506478">Pay by app, meter or SMS</text>
  <text x="205" y="282" text-anchor="middle" font-size="15" fill="#506478">Illustration only</text>
  <!-- callouts -->
  <g font-size="19" fill="#172c45">
    <line x1="150" y1="150" x2="400" y2="96" stroke="#172c45" stroke-width="2"/>
    <circle cx="400" cy="96" r="5" fill="#172c45"/>
    <text x="414" y="88" font-weight="700">365 = area number</text>
    <text x="414" y="112" font-size="16" fill="#506478">Type the full code when you pay</text>

    <line x1="246" y1="150" x2="400" y2="196" stroke="#e8533f" stroke-width="2"/>
    <circle cx="400" cy="196" r="5" fill="#e8533f"/>
    <text x="414" y="188" font-weight="700" fill="#e8533f">A = tariff zone</text>
    <text x="414" y="212" font-size="16" fill="#506478">A, C roadside · B, D parking plots</text>

    <line x1="282" y1="150" x2="400" y2="296" stroke="#2869b0" stroke-width="2"/>
    <circle cx="400" cy="296" r="5" fill="#2869b0"/>
    <text x="414" y="288" font-weight="700" fill="#2869b0">P = premium space</text>
    <text x="414" y="312" font-size="16" fill="#506478">Higher price at peak times</text>
  </g>
  <text x="414" y="372" font-size="15" fill="#506478">No P? It is a standard space.</text>
</svg>
