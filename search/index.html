<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,follow"><title>Search | IonicRide</title></head><body style="font:18px system-ui;max-width:850px;margin:40px auto;padding:20px"><a href="/">← IonicRide home</a><h1>Search IonicRide</h1><form><label for="q">Search guides and articles</label><p><input id="q" name="q" style="font:inherit;padding:12px;max-width:75%"><button style="font:inherit;padding:12px">Search</button></p></form><p id="status"></p><div id="results"></div><script>const q=new URLSearchParams(location.search).get('q')||'';document.querySelector('#q').value=q;if(q)fetch('/search-index.json').then(r=>r.json()).then(items=>{const words=q.toLowerCase().trim().split(/\s+/);const matches=items.map(p=>({...p,score:words.reduce((s,w)=>s+(p.title.toLowerCase().includes(w)?5:0)+(p.description.toLowerCase().includes(w)?2:0)+(p.text.toLowerCase().includes(w)?1:0),0)})).filter(p=>words.every(w=>(p.title+' '+p.description+' '+p.text).toLowerCase().includes(w))).sort((a,b)=>b.score-a.score).slice(0,40);document.querySelector('#status').textContent=matches.length+' results';for(const p of matches){const article=document.createElement('article');const h=document.createElement('h2');const a=document.createElement('a');a.href=p.url;a.textContent=p.title;h.append(a);article.append(h);const d=document.createElement('p');d.textContent=p.description;article.append(d);document.querySelector('#results').append(article);}}).catch(()=>document.querySelector('#status').textContent='Search is unavailable. Please browse from the home page.');</script></body></html>
